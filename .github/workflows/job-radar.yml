name: AI Career Agent - Job Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan jobs
        run: python scripts/job_radar.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Publish feed
        run: |
          git config user.name "ai-career-agent"
          git config user.email "ai-career-agent@users.noreply.github.com"
          git add data/jobs.json data/seen.json
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "chore: update job radar feed"
            git push
          fi
